version: "3.9"

services:
  redis:
    container_name: redis
    image: redis
    restart: always
    ports: 
    - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning


  backend:
    build: .
    container_name: backend_todo
    command: gunicorn core.wsgi --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=False
    volumes:
      - ./core:/app
    depends_on:
      - redis
    

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    depends_on:
      - redis
      - backend
    volumes:
      - ./core:/app


  nginx: 
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes: 
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - redis
      - backend